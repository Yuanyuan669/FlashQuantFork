
name: flashquant

on:
  # 2026-10-09：schedule 已迁移至 cron-job.org 外部触发（workflow_dispatch），勿在此恢复。
  # 原因（实测）：GitHub 内置 schedule 对本仓投递严重延迟且不规律（55 分钟 ~ 5.9 小时）。
  # 外部触发 payload 示例：{"ref":"master","inputs":{"mode":"daily"}}
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor=常规采集+聚合告警；daily=收盘后日报（额外跑 run.py：日报/LLM综述/daily_sentiment/dashboard 刷新）"
        type: choice
        options: [monitor, daily]
        default: monitor
      rescore:
        description: "重打分 raw 全量（FinBERT/词典）+ 重建情绪历史（一次性维护操作）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flashquant
  cancel-in-progress: false

jobs:
  flashquant:
    runs-on: [self-hosted, flashquant]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # SSH 协议 fetch/push：自托管机 HTTPS+GnuTLS 不稳（同 TM DevLog 2026-07-11 的结论）
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure venv (uv-managed python 3.12, persistent)
        env:
          # pypi 走清华镜像直连（代理节点对 pypi.org 线路不稳）；HF 模型下载走国内镜像
          # 注意：GitHub 解析 env 键不区分大小写，NO_PROXY/no_proxy 重复会导致 workflow 解析失败
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
          NO_PROXY: pypi.tuna.tsinghua.edu.cn,hf-mirror.com,127.0.0.1,localhost
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          VENV="$HOME/.venvs/flashquant"
          # venv 存在但版本 <3.12 时重建（历史残留的 py3.10 venv 会导致依赖装不进去）
          if [ ! -x "$VENV/bin/python" ] || ! "$VENV/bin/python" -c "import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)"; then
            rm -rf "$VENV"
            uv venv "$VENV" -p 3.12
          fi
          uv pip install -p "$VENV/bin/python" -r requirements-server.txt
          # FinBERT 模型预下载（~440MB，HF 国内镜像直连；失败不阻塞，运行时会重试+降级词典）
          "$VENV/bin/python" -c "from transformers import pipeline; pipeline('text-classification', model='ProsusAI/finbert')" \
            || echo "[warn] FinBERT 预下载失败"
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: Run monitor (one round)
        env:
          HF_ENDPOINT: https://hf-mirror.com
          no_proxy: hf-mirror.com,127.0.0.1,localhost
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          "$VENV/bin/python" news_aggregator/monitor.py --once --no-stock-impact

      - name: Daily report + summary + dashboard (mode=daily only)
        if: inputs.mode == 'daily'
        env:
          HF_ENDPOINT: https://hf-mirror.com
          no_proxy: hf-mirror.com,127.0.0.1,localhost
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_WEBHOOK_DAILY: ${{ secrets.WECOM_WEBHOOK_DAILY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          "$VENV/bin/python" news_aggregator/run.py --push

      - name: Rescore raw (one-off)
        if: ${{ inputs.rescore == true }}
        timeout-minutes: 60
        run: |
          "$VENV/bin/python" scripts/rescore_raw.py

      - name: Commit news state
        run: |
          # seen.json / raw / alerts / daily_sentiment / report / dashboard 必须持久化。
          # 本工作流是 news/ 的唯一写入方（news-aggregator.yml 已退役），不再有多写冲突。
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/ dashboard/index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: flashquant update $(date '+%F %H:%M') mode=${{ inputs.mode }}"
            git pull --rebase --autostash origin master
            git push
          fi
