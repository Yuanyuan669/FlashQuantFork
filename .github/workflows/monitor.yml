name: monitor

on:
  # 2026-10-09：schedule 已迁移至 cron-job.org 外部触发（workflow_dispatch），勿在此恢复。
  # 原因（实测）：GitHub 内置 schedule 对本仓投递严重延迟且不规律 —— 2026-10-07~09 的
  # 7 次 schedule run 中，created_at 与 run_started_at 差值全为 0（自建机秒接，延迟不在
  # runner 侧），但投递时刻比 cron 晚 55 分钟 ~ 5.9 小时，且缺槽与重复并存。
  # monitor 的四个时点（盘前 08:45 / 午间 11:35 / 收盘 15:05 / 美股开盘 21:30）
  # 晚数小时即失去意义。GitHub 对 fork 仓库的 scheduled workflow 默认禁用、启用后投递
  # 仍不可靠，故统一改外部触发（与 TradingMaster 同一结论）。
  # 原 cron（保留备查，勿恢复；UTC，* * 1-5）= 北京 08:45 / 11:35 / 15:05 / 21:30：
  #   - cron: "45 0 * * 1-5"
  #   - cron: "35 3 * * 1-5"
  #   - cron: "5 7 * * 1-5"
  #   - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: [self-hosted, flashquant]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # SSH 协议 fetch/push：自托管机 HTTPS+GnuTLS 不稳（同 TM DevLog 2026-07-11 的结论）
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ensure venv (uv-managed python 3.12, persistent)
        env:
          # pypi 走清华镜像直连（代理节点对 pypi.org 线路不稳）；HF 模型下载走国内镜像
          # 注意：GitHub 解析 env 键不区分大小写，NO_PROXY/no_proxy 重复会导致 workflow 解析失败
          PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
          NO_PROXY: pypi.tuna.tsinghua.edu.cn,hf-mirror.com,127.0.0.1,localhost
          HF_ENDPOINT: https://hf-mirror.com
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          VENV="$HOME/.venvs/flashquant"
          # venv 存在但版本 <3.12 时重建（历史残留的 py3.10 venv 会导致依赖装不进去）
          if [ ! -x "$VENV/bin/python" ] || ! "$VENV/bin/python" -c "import sys; sys.exit(0 if sys.version_info >= (3, 12) else 1)"; then
            rm -rf "$VENV"
            uv venv "$VENV" -p 3.12
          fi
          uv pip install -p "$VENV/bin/python" -r requirements-server.txt
          # FinBERT 模型预下载（~440MB，走 runner 代理；失败不阻塞，运行时会重试+降级词典）
          "$VENV/bin/python" -c "from transformers import pipeline; pipeline('text-classification', model='ProsusAI/finbert')" \
            || echo "[warn] FinBERT 预下载失败"
          echo "VENV=$VENV" >> "$GITHUB_ENV"

      - name: Run monitor (one round)
        run: |
          "$VENV/bin/python" news_aggregator/monitor.py --once --no-stock-impact
        env:
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
          HF_ENDPOINT: https://hf-mirror.com
          no_proxy: hf-mirror.com,127.0.0.1,localhost
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_WEBHOOK_DAILY: ${{ secrets.WECOM_WEBHOOK_DAILY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Commit news state
        run: |
          # seen.json / raw / alerts 必须持久化：跨 run 去重与告警状态依赖它们
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: monitor update $(date '+%F %H:%M')"
          fi
          # 本地与 CI 可能并发推送：先同步再推，避免 non-fast-forward
          git pull --rebase origin master
          git push
