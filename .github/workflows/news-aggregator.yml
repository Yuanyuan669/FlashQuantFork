name: news-aggregator

on:
  # 2026-10-09：schedule 已迁移至 cron-job.org 外部触发（workflow_dispatch），勿在此恢复。
  # 原因同 monitor.yml：GitHub 内置 schedule 对本仓投递晚 3.5~7 小时（实测 10-06 的
  # 18:30 cron 实际 22:00 才投递，10-07 的到次日 01:28 才投递）。
  # 原 cron（保留备查，勿恢复；UTC）= 北京 18:30：
  #   - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-server.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run aggregator
        run: python news_aggregator/run.py --push
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          QUIVER_TOKEN: ${{ secrets.QUIVER_TOKEN }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

      - name: Commit news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # dashboard/index.html 由 run.py 末尾重建（2026-10-06 起），它在 news/ 之外：
          # 只 add news/ 会让它留成未暂存改动 -> git pull --rebase 直接拒绝
          # （cannot pull with rebase: You have unstaged changes），聚合结果推不上去
          # （daily_sentiment.json 曾因此停更 2026-10-03 ~ 10-08）
          git add news/ dashboard/index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update news aggregation $(date +%F)"
          fi
          # 本地与 CI 可能并发推送：先同步再推，避免 non-fast-forward
          # --autostash：兜底任何其它生成物弄脏工作区，避免 rebase 被拒
          git pull --rebase --autostash origin master
          git push


